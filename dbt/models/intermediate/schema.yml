version: 2

models:
  - name: int_enriched_episodes
    description: >
      Episodes enriched with show genre metadata from iTunes.
      Joins stg_episodes to stg_shows on show_name to add genre information
      to each episode chart record. Also adds formatted duration column.
      One row per episode per region per collection date.
    columns:
      - name: episode_name
        description: "Name of the individual podcast episode"
        tests:
          - not_null
      - name: show_name
        description: "Name of the podcast"
        tests:
          - not_null
      - name: primary_genre
        description: "Primary genre from iTunes — may be null for shows not found in iTunes"
      - name: all_genres
        description: "Full genre list from iTunes — may be null for shows not found in iTunes"
      - name: duration_formatted
        description: "Episode duration in HH:MM:SS format derived from duration_ms"
      - name: daily_rank
        description: "Chart position for the episode on the collection date"
        tests:
          - not_null
      - name: collection_date
        description: "Date the chart position was recorded"
        tests:
          - not_null

  - name: int_show_rankings
    description: >
      Show level aggregation of chart performance.
      Calculates average best rank per show by first finding each episode's
      peak chart position, then averaging those across all episodes per show.
      Also calculates ranked episode rate as a measure of catalog performance.
      One row per unique podcast show.
    columns:
      - name: show_name
        description: "Name of the podcast"
        tests:
          - not_null
          - unique
      - name: avg_rank
        description: "Average of each episode's best chart position — lower is better"
        tests:
          - not_null
      - name: ranked_episodes
        description: "Number of episodes from this show that appeared in the top 200"
        tests:
          - not_null
      - name: total_episodes
        description: "Total episodes published by the show as of last chart appearance"
      - name: ranked_episode_rate
        description: "Ratio of ranked episodes to total episodes — measure of catalog performance"
      - name: primary_genre
        description: "Primary genre classification from iTunes"
      - name: publisher
        description: "Publisher or creator of the podcast"